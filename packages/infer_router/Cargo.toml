[package]
name = "jiuwen-data-plane"
version = "0.1.0"
edition = "2021"

[lib]
name = "_data_plane"
path = "src/openjiuwentools/infer_router/data_plane/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
axum = "0.8"
bytes = "1"
futures = "0.3"
http = "1"
pyo3 = { version = "0.24", features = ["extension-module"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
