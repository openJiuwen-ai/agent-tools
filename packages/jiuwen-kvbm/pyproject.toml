[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwen-kvbm"
version = "0.0.1"
description = "Jiuwen KV Block Manager core package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenJiuwen Team", email = "team@openjiuwen.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jiuwen-kvbm-benchmark = "jiuwen_kvbm.benchmark.cli:main"
jiuwen-kvbm-standalone-benchmark = "jiuwen_kvbm.benchmark.standalone:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
