[pytest]
testpaths = tests
pythonpath = pysrc
python_files = test_*.py
python_functions = test_*
markers =
    npu: requires Ascend NPU + built openjiuwen_ascend_ops wheel
    golden: numerical correctness vs CPU reference
    perf: latency smoke (collects ms; does not enforce a hard budget by default)
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
